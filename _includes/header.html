<header class="site-header container">
  <div class="site-header__bar">
    <a class="site-header__home" href="{{ '/' | relative_url }}" aria-label="Charles Barnes, home">{% include badge.html %}</a>
    <div class="site-header__actions">
      <nav class="site-header__nav site-nav" aria-label="Primary" data-nav>
        {% for item in site.data.navigation %}
          {% if item.external %}
            <a class="site-nav__link" href="{{ item.url }}" target="_blank" rel="noopener noreferrer">{{ item.label }}<i class="site-nav__external fa-regular fa-arrow-up-right" aria-hidden="true"></i></a>
          {% else %}
            <a class="site-nav__link" href="{{ item.url | relative_url }}"{% if page.nav == item.id %} aria-current="page"{% endif %}>{{ item.label }}</a>
          {% endif %}
        {% endfor %}
        <span class="site-nav__dot" data-nav-dot></span>
      </nav>
      <a class="site-header__contact button button--accent button--sm" href="mailto:{{ site.email }}">Contact</a>
      {% include theme_toggle.html %}
      <button type="button" class="site-header__menu icon-button" data-menu-open aria-label="Open menu" aria-haspopup="dialog">
        <i class="fa-regular fa-bars" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>

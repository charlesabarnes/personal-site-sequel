<meta charset="utf-8">
<title>{% if page.title %}{% if page.title contains site.title %}{{ page.title }}{% else %}{{ page.title }} - {{ site.title }}{% endif %}{% else %}{{ site.title }}{% endif %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<link rel="mask-icon" href="{{ '/safari-pinned-tab.svg' | relative_url }}" color="#333333">
<link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
<meta name="msapplication-TileColor" content="#333333">
<meta name="msapplication-config" content="{{ '/browserconfig.xml' | relative_url }}">
<meta name="theme-color" content="#FFFAF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#333333" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>document.documentElement.dataset.theme=(function(){try{return localStorage.getItem("theme")}catch(e){}})()||"light";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Kanit:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/fontawesome/css/fontawesome.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/fontawesome/css/brands.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/fontawesome/css/regular.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/fontawesome/css/solid.min.css' | relative_url }}">
<script src="{{ '/assets/js/script.js' | relative_url }}" defer></script>

<meta name="author" content="{% if page.author %}{{ page.author }}{% else %}{{ site.author }}{% endif %}">
<meta name="keywords" content="{% if page.tags %}{{ page.tags | join: ',' }}{% else %}HTML,CSS,JavaScript,Charles,Barnes,web,developer,website,development,Missouri,Charles Barnes,Saint Louis Developer,St louis{% endif %}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  {% if page.layout == "post" %}
  "@type": "BlogPosting",
  "headline": "{{ page.title }}",
  "image": "{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/assets/images/blog/default-image.png' | absolute_url }}{% endif %}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}",
  {% if page.description %}
  "description": "{{ page.description }}",
  {% elsif page.excerpt %}
  "description": "{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}",
  {% else %}
  "description": "{{ site.description }}",
  {% endif %}
  "author": {
    "@type": "Person",
    "name": "{% if page.author %}{{ page.author }}{% else %}{{ site.author }}{% endif %}"
  },
  {% if page.categories contains 'movies' %}
  "review": {
    "@type": "Review",
    "reviewRating": {
      "@type": "Rating",
      "ratingValue": "{{ page.rating | default: 5 }}",
      "bestRating": "10"
    },
    "itemReviewed": {
      "@type": "Movie",
      "name": "{% if page.movie_title %}{{ page.movie_title }}{% else %}{{ page.title | remove: 'Movie Review: ' | remove: 'Review: ' }}{% endif %}",
      {% if page.release_year %}
      "dateCreated": "{{ page.release_year }}-01-01",
      {% endif %}
      {% if page.director %}
      "director": "{{ page.director }}",
      {% endif %}
      {% if page.content_rating %}
      "contentRating": "{{ page.content_rating }}",
      {% endif %}
      {% if page.genres %}
      "genre": [{% for genre in page.genres %}"{{ genre }}"{% unless forloop.last %}, {% endunless %}{% endfor %}]
      {% endif %}
    }
  },
  {% endif %}
  "publisher": {
    "@type": "Organization",
    "name": "{{ site.title }}",
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.logo | absolute_url }}"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  }
  {% else %}
  "@type": "WebSite",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}",
  "description": "{{ site.description }}"
  {% endif %}
}
</script>

{% seo title=false %}

{% unless page.image %}
<meta property="og:image" content="{{ '/assets/images/blog/default-image.png' | absolute_url }}">
{% endunless %}

<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{ page.url | absolute_url }}">
<meta property="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="twitter:description" content="{% if page.description %}{{ page.description }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
<meta property="twitter:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/assets/images/blog/default-image.png' | absolute_url }}{% endif %}">

<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">

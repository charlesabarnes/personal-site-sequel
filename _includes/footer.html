<footer class="site-footer">
  <div class="site-footer__social">
    {% for link in site.data.social %}
      {% assign url = link.url %}
      {% if url contains ':' %}{% else %}{% assign url = link.url | relative_url %}{% endif %}
      <a href="{{ url }}" aria-label="{{ link.label }}"{% unless url contains 'mailto:' %} target="_blank" rel="noopener noreferrer"{% endunless %}><i class="{{ link.icon }}" aria-hidden="true"></i></a>
    {% endfor %}
  </div>
  <div class="site-footer__copyright">&copy; {{ site.time | date: '%Y' }} Charles Barnes</div>
</footer>
